<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统配置 - XHS-Downloader 管理后台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/" class="sidebar-logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="8" fill="url(#logo-gradient)"/>
                        <path d="M12 28V12h6l6 8-6 8h-6z" fill="#fff"/>
                        <path d="M28 12h-6v16h6" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="logo-gradient" x1="0" y1="0" x2="40" y2="40">
                                <stop stop-color="#4f46e5"/>
                                <stop offset="1" stop-color="#8b5cf6"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <h1>XHS-Downloader</h1>
                </a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">数据采集</div>
                    <a href="/" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 3v18h18"/>
                            <path d="M7 16l4-4 4 4 5-5"/>
                        </svg>
                        <span>下载任务</span>
                    </a>
                    <a href="/history" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        <span>下载历史</span>
                    </a>
                    <a href="/preview" class="nav-item">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <span>图片预览</span>
                    </a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统管理</div>
                    <a href="/settings" class="nav-item active">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span>系统配置</span>
                    </a>
                </div>
            </nav>
        </aside>
        
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <div class="breadcrumb">
                        <a href="/">首页</a>
                        <span>/</span>
                        <span>系统配置</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="header-btn" title="刷新">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                    </button>
                    <div class="user-avatar">管</div>
                </div>
            </header>
            
            <div class="page-content">
                <div class="page-header">
                    <h1 class="page-title">系统配置</h1>
                    <p class="page-description">自定义程序运行参数，修改后需要重启软件才能生效</p>
                </div>
                
                <div class="card animate-fade-in">
                    <div class="card-header">
                        <h2 class="card-title">基本设置</h2>
                    </div>
                    <div class="card-body">
                        <form id="settings-form">
                            <div class="settings-grid">
                                <div class="settings-section">
                                    <h3 class="settings-section-title">路径设置</h3>
                                    <div class="form-group">
                                        <label class="form-label" for="work_path">工作路径</label>
                                        <input type="text" class="form-input" id="work_path" name="work_path" value="{{ config.work_path }}">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="folder_name">文件夹名称</label>
                                        <input type="text" class="form-input" id="folder_name" name="folder_name" value="{{ config.folder_name }}">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="name_format">命名格式</label>
                                        <input type="text" class="form-input" id="name_format" name="name_format" value="{{ config.name_format }}">
                                        <div class="tag-selector" style="margin-top: 12px;">
                                            <span class="form-label" style="font-size: 14px;">可用标签：</span>
                                            <div class="tags" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
                                                <span class="tag tag-primary" onclick="addTag('发布时间')">发布时间</span>
                                                <span class="tag tag-primary" onclick="addTag('作者昵称')">作者昵称</span>
                                                <span class="tag tag-primary" onclick="addTag('作品标题')">作品标题</span>
                                                <span class="tag tag-primary" onclick="addTag('作品描述')">作品描述</span>
                                                <span class="tag tag-primary" onclick="addTag('作品类型')">作品类型</span>
                                                <span class="tag tag-primary" onclick="addTag('作者ID')">作者ID</span>
                                                <span class="tag tag-primary" onclick="addTag('作品ID')">作品ID</span>
                                                <span class="tag tag-primary" onclick="addTag('收藏数量')">收藏数量</span>
                                                <span class="tag tag-primary" onclick="addTag('评论数量')">评论数量</span>
                                                <span class="tag tag-primary" onclick="addTag('分享数量')">分享数量</span>
                                                <span class="tag tag-primary" onclick="addTag('点赞数量')">点赞数量</span>
                                                <span class="tag tag-primary" onclick="addTag('作品标签')">作品标签</span>
                                                <span class="tag tag-primary" onclick="addTag('最后更新时间')">最后更新时间</span>
                                                <span class="tag tag-primary" onclick="addTag('时间戳')">时间戳</span>
                                            </div>
                                        </div>
                                    </div>
                                    <script>
                                        function addTag(tag) {
                                            const input = document.getElementById('name_format');
                                            const currentValue = input.value;
                                            if (currentValue) {
                                                input.value = currentValue + ' ' + tag;
                                            } else {
                                                input.value = tag;
                                            }
                                            input.focus();
                                        }
                                    </script>
                                    <div class="form-group">
                                        <label class="form-label" for="import_webhook">Happytime 导入回调</label>
                                        <input type="text" class="form-input" id="import_webhook" name="import_webhook" value="{{ config.import_webhook }}" placeholder="http://127.0.0.1:3000/api/xhs/webhook">
                                        <p style="margin-top:8px;color:var(--text-muted, #666);font-size:13px;">下载成功后 POST 作品元数据与本地文件路径到该地址，供 Happytime 入库。</p>
                                    </div>
                                </div>
                                
                                <div class="settings-section">
                                    <h3 class="settings-section-title">下载设置</h3>
                                    <div class="form-group">
                                        <label class="form-label" for="image_format">图片格式</label>
                                        <input type="text" class="form-input" id="image_format" name="image_format" value="{{ config.image_format }}">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="timeout">超时时间</label>
                                        <input type="number" class="form-input" id="timeout" name="timeout" value="{{ config.timeout }}">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="max_retry">最大重试次数</label>
                                        <input type="number" class="form-input" id="max_retry" name="max_retry" value="{{ config.max_retry }}">
                                    </div>
                                </div>
                                
                                <div class="settings-section">
                                    <h3 class="settings-section-title">功能开关</h3>
                                    <div class="form-group">
                                        <label class="form-checkbox">
                                            <input type="checkbox" id="image_download" name="image_download" {% if config.image_download %}checked{% endif %}>
                                            <span>下载图片</span>
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-checkbox">
                                            <input type="checkbox" id="video_download" name="video_download" {% if config.video_download %}checked{% endif %}>
                                            <span>下载视频</span>
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-checkbox">
                                            <input type="checkbox" id="live_download" name="live_download" {% if config.live_download %}checked{% endif %}>
                                            <span>下载动图</span>
                                        </label>
                                    </div>
                                </div>
                                
                                <div class="settings-section">
                                    <h3 class="settings-section-title">其他设置</h3>
                                    <div class="form-group">
                                        <label class="form-label" for="language">语言</label>
                                        <select class="form-select" id="language" name="language">
                                            <option value="zh_CN" {% if config.language == 'zh_CN' %}selected{% endif %}>中文</option>
                                            <option value="en_US" {% if config.language == 'en_US' %}selected{% endif %}>英文</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div style="margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border-color);">
                                <button type="submit" class="btn btn-primary">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                                        <polyline points="17 21 17 13 7 13 7 21"/>
                                        <polyline points="7 3 7 8 15 8"/>
                                    </svg>
                                    保存配置
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div id="result" style="margin-top: 24px;"></div>
            </div>
        </main>
    </div>
    
    <script src="/static/js/settings.js"></script>
</body>
</html>
